# YOLOv11 + EfficientNetV2 backbone + GSStar neck — AGPL-3.0 license
# ------------------------------------------------------------------
# Backbone: EfficientNetV2 (FusedMBConv early + MBConv late) + SPPF + C2PSA
# Neck    : GSStarBlock (Ghost + Shuffle + Star + OSA)  — thay C3k2
# Head    : Detect anchor-free (P3, P4, P5) chuẩn Ultralytics
#
# GSStarBlock nhẹ hơn và mạnh hơn C3k2 ở neck vì:
#   • Ghost module giảm 50% conv chính (GhostNet — CVPR 2020).
#   • Star Op ánh xạ implicit chiều cao (StarNet — CVPR 2024).
#   • Channel Shuffle đảm bảo thông tin chéo nhánh (ShuffleNetV2 — ECCV 2018).
#   • One-Shot Aggregation giảm I/O memory (VoVNet — CVPR 2019).

nc: 80

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]


# ───────────── EfficientNetV2 BACKBONE ─────────────
backbone:
  - [-1, 1, Conv, [64, 3, 2]]                 # 0-P1/2   stem
  - [-1, 1, FusedMBConv, [64, 1, 1]]          # 1-P1/2   fused, expand=1
  - [-1, 2, FusedMBConv, [128, 2, 4]]         # 2-P2/4
  - [-1, 2, FusedMBConv, [256, 2, 4]]         # 3-P3/8   <== P3
  - [-1, 3, MBConv,      [512, 2, 4]]         # 4-P4/16
  - [-1, 2, MBConv,      [512, 1, 4]]         # 5-P4/16  <== P4
  - [-1, 2, MBConv,      [1024, 2, 5]]        # 6-P5/32
  - [-1, 1, SPPF,        [1024, 5]]           # 7-P5/32
  - [-1, 2, C2PSA,       [1024]]              # 8-P5/32  <== P5


# ───────────── GSStar NECK (thay cho C3k2 PAN) ─────────────
head:
  # ---------- Top-down: P5 → P4 ----------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 9
  - [[-1, 5], 1, Concat, [1]]                    # 10  cat backbone P4 (layer 5)
  - [-1, 2, GSStarBlock, [512, 0.5, False]]      # 11

  # ---------- Top-down: P4 → P3 ----------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 3], 1, Concat, [1]]                    # 13  cat backbone P3 (layer 3)
  - [-1, 2, GSStarBlock, [256, 0.5, False]]      # 14  P3 OUT

  # ---------- Bottom-up: P3 → P4 ----------
  - [-1, 1, Conv, [256, 3, 2]]                   # 15
  - [[-1, 11], 1, Concat, [1]]                   # 16  cat head P4 (layer 11)
  - [-1, 2, GSStarBlock, [512, 0.5, False]]      # 17  P4 OUT

  # ---------- Bottom-up: P4 → P5 ----------
  - [-1, 1, Conv, [512, 3, 2]]                   # 18
  - [[-1, 8], 1, Concat, [1]]                    # 19  cat backbone P5 (layer 8 = C2PSA)
  - [-1, 2, GSStarCSP,   [1024, 0.5, True]]      # 20  P5 OUT (dùng CSP ở P5 sâu)

  # ---------- Detect ----------
  - [[14, 17, 20], 1, Detect, [nc]]              # 21  Detect(P3, P4, P5)
