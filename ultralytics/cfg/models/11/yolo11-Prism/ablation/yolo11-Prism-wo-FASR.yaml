# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11-Prism Ablation Study: w/o FASR (DFDC + MCG active, FASR ablated in Neck)
# Isolates the contribution of the Neck's Frequency-Aware Spatial Refinement by removing it from Full Prism.

nc: 80
scales:
  n: [0.50, 0.25, 1024]    # Prism-n
  s: [0.50, 0.50, 1024]    # Prism-s
  m: [0.50, 1.00, 512]     # Prism-m
  l: [1.00, 1.00, 512]     # Prism-l
  x: [1.00, 1.50, 512]     # Prism-x

backbone:
  # ── Stage 0: Stem ──
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2

  # ── Stage 1: P1 → P2 ──
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 2, C3k2_Prism, [128, False]]            # 2-P2/4  Prism blocks ×2 (DFDC + MCG)

  # ── Stage 2: P2 → P3 ──
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8
  - [-1, 2, C3k2_Prism, [256, False]]            # 4-P3/8  Prism blocks ×2

  # ── Stage 3: P3 → P4 ──
  - [-1, 1, Conv, [512, 3, 2]]                   # 5-P4/16
  - [-1, 2, C3k2_Prism, [512, False]]            # 6-P4/16 Prism blocks ×2

  # ── Stage 4: P4 → P5 ──
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7-P5/32
  - [-1, 2, C3k2_Prism, [1024, True]]            # 8-P5/32 Prism blocks ×2 (c3k=True)
  - [-1, 1, SPPF, [1024, 5]]                     # 9-P5/32

head:
  # ════════ FPN: Top-Down Pathway ════════
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                     # 11
  - [-1, 2, PrismCSP_NoFASR, [512, False]]        # 12 Prism fusion WITHOUT FASR (P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                     # 14
  - [-1, 3, PrismCSP_NoFASR, [256, False]]        # 15 Prism fusion WITHOUT FASR (P3)

  # ════════ PAN: Bottom-Up Pathway ════════
  - [-1, 1, Conv, [256, 3, 2]]                    # 16
  - [[-1, 12], 1, Concat, [1]]                    # 17
  - [-1, 2, PrismCSP_NoFASR, [512, False]]        # 18 Prism fusion WITHOUT FASR (P4)

  - [-1, 1, Conv, [512, 3, 2]]                    # 19
  - [[-1, 9], 1, Concat, [1]]                     # 20
  - [-1, 2, PrismCSP_NoFASR, [1024, True]]        # 21 Prism fusion WITHOUT FASR (P5)

  # ════════ Detection Head ════════
  - [[15, 18, 21], 1, Detect, [nc]]               # 22 Detect(P3, P4, P5)
