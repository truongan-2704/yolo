# YOLOv12 + GhostNet backbone, AGPL-3.0 license
# ------------------------------------------------------------------
# Nghiên cứu gốc:
#   - GhostNet: Han et al., "GhostNet: More Features from Cheap Operations"
#     (CVPR 2020). Sinh "ghost feature maps" bằng cheap linear ops (DWConv)
#     từ feature map chính → giảm ~50% FLOPs ở cùng số kênh.
#   - YOLOv12: Area-Attention trong neck.
#
# Lý do thiết kế:
#   - GhostConv (cheap-op) thay Conv thường tại stem & downsample → giảm
#     FLOPs toàn cục ~40%.
#   - GhostBottleneck (k=3, s=1/2) thay các block nặng → kênh "ghost" gấp 2
#     lần kênh "cheap" giúp giữ biểu diễn đủ rộng.
#   - Vẫn dùng A2C2f ở P5 và 2 nhánh neck để có receptive field toàn cục
#     (GhostNet thuần thiếu attention).
#
# Signature:
#   GhostConv(c1, c2, k=1, s=1, g=1, act=True)
#   GhostBottleneck(c1, c2, k=3, s=1)     # c_ = c2 // 2, skip nếu s==1 & c1==c2

nc: 80

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]


# ──────────────────────────── GHOSTNET BACKBONE ────────────────────────────
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,            [64, 3, 2]]       # 0-P1/2   stem (giữ Conv thường để học low-level feature)

  # ---- Stage P2/4 ----
  - [-1, 1, GhostConv,       [128, 3, 2]]      # 1-P2/4   cheap downsample
  - [-1, 2, GhostBottleneck, [128, 3, 1]]      # 2-P2/4   n=2 ghost blocks

  # ---- Stage P3/8 ----
  - [-1, 1, GhostConv,       [256, 3, 2]]      # 3-P3/8
  - [-1, 2, GhostBottleneck, [256, 3, 1]]      # 4-P3/8   <== P3 OUT

  # ---- Stage P4/16 ----
  - [-1, 1, GhostConv,       [512, 3, 2]]      # 5-P4/16
  - [-1, 4, GhostBottleneck, [512, 3, 1]]      # 6-P4/16  <== P4 OUT

  # ---- Stage P5/32 ----
  - [-1, 1, GhostConv,       [1024, 3, 2]]     # 7-P5/32
  - [-1, 2, GhostBottleneck, [1024, 3, 1]]     # 8-P5/32

  # ---- Bổ trợ P5: SPPF + A2C2f toàn cục ----
  - [-1, 1, SPPF,            [1024, 5]]        # 9-P5/32
  - [-1, 1, A2C2f,           [1024, True, 1]]  # 10-P5/32 <== P5 OUT


# ──────────────────────────── PAN-A² NECK (Ghost-light) ────────────────────────────
head:
  # ---- Top-down: P5 → P4 ----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12  cat backbone P4 (layer 6)
  - [-1, 2, A2C2f, [512, False, -1]]             # 13

  # ---- Top-down: P4 → P3 ----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15  cat backbone P3 (layer 4)
  - [-1, 2, A2C2f, [256, False, -1]]             # 16  P3 OUT

  # ---- Bottom-up: P3 → P4 (dùng GhostConv xuống mẫu để tiết kiệm) ----
  - [-1, 1, GhostConv, [256, 3, 2]]              # 17
  - [[-1, 13], 1, Concat, [1]]                   # 18  cat head P4 (layer 13)
  - [-1, 2, A2C2f, [512, False, -1]]             # 19  P4 OUT

  # ---- Bottom-up: P4 → P5 ----
  - [-1, 1, GhostConv, [512, 3, 2]]              # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21  cat backbone P5 (layer 10)
  - [-1, 2, C3k2, [1024, True]]                  # 22  P5 OUT

  - [[16, 19, 22], 1, Detect, [nc]]              # 23  Detect(P3, P4, P5)
