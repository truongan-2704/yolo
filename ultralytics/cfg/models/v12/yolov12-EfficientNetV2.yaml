# YOLOv12 + EfficientNetV2 backbone, AGPL-3.0 license
# Backbone  : EfficientNetV2 (FusedMBConv early stages + MBConv late stages)
# Neck      : YOLOv12-turbo PANet với A2C2f (Area-Attention) giữ nguyên
# Head      : Detect anchor-free (P3, P4, P5) chuẩn Ultralytics
# Ý tưởng   : kết hợp ưu thế pretrain mạnh + Fused-MBConv của EffV2 ở P2/P3/P4
#             với Area-Attention (A2C2f) ở đỉnh P5 + neck để giữ ngữ cảnh toàn cục.
#
# Lưu ý kênh: scale 'n' dùng width_multiple=0.25 → kênh thực tế nhỏ hơn 4x so
# với số khai báo. Các giá trị dưới đây là giá trị "danh nghĩa" (trước scale).

nc: 80  # number of classes

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]


# ──────────────────────────── EfficientNetV2 BACKBONE ────────────────────────────
backbone:
  # [from, repeats, module, args]
  # ---- Stem ----
  - [-1, 1, Conv, [64, 3, 2]]                 # 0-P1/2     stem Conv 3x3 s=2

  # ---- Stage 1: Fused-MBConv, expand=1, stride=1 (giữ P1/2) ----
  - [-1, 1, FusedMBConv, [64, 1, 1]]          # 1-P1/2     n=1, s=1, expand=1

  # ---- Stage 2: Fused-MBConv, expand=4, stride=2 → P2/4 ----
  - [-1, 2, FusedMBConv, [128, 2, 4]]         # 2-P2/4     n=2, s=2, expand=4

  # ---- Stage 3: Fused-MBConv, expand=4, stride=2 → P3/8 (xuất cho neck) ----
  - [-1, 2, FusedMBConv, [256, 2, 4]]         # 3-P3/8     <== P3 feature

  # ---- Stage 4: MBConv (depthwise + SE), expand=4, stride=2 → P4/16 ----
  - [-1, 3, MBConv, [512, 2, 4]]              # 4-P4/16

  # ---- Stage 5: MBConv, expand=4, stride=1 (vẫn P4/16, làm sâu đặc trưng) ----
  - [-1, 2, MBConv, [512, 1, 4]]              # 5-P4/16    <== P4 feature

  # ---- Stage 6: MBConv, expand=5, stride=2 → P5/32 ----
  - [-1, 2, MBConv, [1024, 2, 5]]             # 6-P5/32

  # ---- Bổ trợ P5: SPPF + A2C2f (Area-Attention) ----
  - [-1, 1, SPPF,  [1024, 5]]                 # 7-P5/32    multi-scale pool
  - [-1, 1, A2C2f, [1024, True, 1]]           # 8-P5/32    area=1 (toàn cục), <== P5 feature


# ──────────────────────────── YOLOv12 PAN-A² NECK ────────────────────────────
head:
  # ---------- Top-down: P5 → P4 ----------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 9   P5→2x
  - [[-1, 5], 1, Concat, [1]]                    # 10  cat(P5_up, backbone P4 = layer 5)
  - [-1, 2, A2C2f, [512, False, -1]]             # 11  area=-1 (linear attention), n=2

  # ---------- Top-down: P4 → P3 ----------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12  P4→2x
  - [[-1, 3], 1, Concat, [1]]                    # 13  cat(P4_up, backbone P3 = layer 3)
  - [-1, 2, A2C2f, [256, False, -1]]             # 14  P3-small OUT

  # ---------- Bottom-up: P3 → P4 ----------
  - [-1, 1, Conv, [256, 3, 2]]                   # 15  P3→P4 downsample
  - [[-1, 11], 1, Concat, [1]]                   # 16  cat(head P3↓, head P4 = layer 11)
  - [-1, 2, A2C2f, [512, False, -1]]             # 17  P4-medium OUT

  # ---------- Bottom-up: P4 → P5 ----------
  - [-1, 1, Conv, [512, 3, 2]]                   # 18  P4→P5 downsample
  - [[-1, 8], 1, Concat, [1]]                    # 19  cat(head P4↓, backbone P5 = layer 8)
  - [-1, 2, C3k2, [1024, True]]                  # 20  P5-large OUT

  # ---------- Detect head (anchor-free, DFL) ----------
  - [[14, 17, 20], 1, Detect, [nc]]              # 21  Detect(P3, P4, P5)
