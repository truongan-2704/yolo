# YOLOv12 + EfficientNetV2 + P2 head, AGPL-3.0 license
# Biến thể 4-scale (P2, P3, P4, P5) — tối ưu cho vật thể NHỎ (PCB, PPE, drone).
# Giữ backbone EffV2 như baseline, mở rộng head sang P2/4.

nc: 80

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]


backbone:
  # ---- Stem + EfficientNetV2 ----
  - [-1, 1, Conv, [64, 3, 2]]                 # 0-P1/2
  - [-1, 1, FusedMBConv, [64, 1, 1]]          # 1-P1/2
  - [-1, 2, FusedMBConv, [128, 2, 4]]         # 2-P2/4   <== P2 feature
  - [-1, 2, FusedMBConv, [256, 2, 4]]         # 3-P3/8   <== P3 feature
  - [-1, 3, MBConv,      [512, 2, 4]]         # 4-P4/16
  - [-1, 2, MBConv,      [512, 1, 4]]         # 5-P4/16  <== P4 feature
  - [-1, 2, MBConv,      [1024, 2, 5]]        # 6-P5/32
  - [-1, 1, SPPF,        [1024, 5]]           # 7-P5/32
  - [-1, 1, A2C2f,       [1024, True, 1]]     # 8-P5/32  <== P5 feature


head:
  # ---------- Top-down: P5 → P4 ----------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 9
  - [[-1, 5], 1, Concat, [1]]                    # 10  cat P4
  - [-1, 2, A2C2f, [512, False, -1]]             # 11

  # ---------- Top-down: P4 → P3 ----------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 3], 1, Concat, [1]]                    # 13  cat P3
  - [-1, 2, A2C2f, [256, False, -1]]             # 14  P3 OUT

  # ---------- Top-down: P3 → P2 (nhánh mới cho small object) ----------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15
  - [[-1, 2], 1, Concat, [1]]                    # 16  cat backbone P2 = layer 2
  - [-1, 2, C3k2, [128, False]]                  # 17  P2 OUT (small-small)

  # ---------- Bottom-up: P2 → P3 ----------
  - [-1, 1, Conv, [128, 3, 2]]                   # 18
  - [[-1, 14], 1, Concat, [1]]                   # 19  cat head P3 = layer 14
  - [-1, 2, A2C2f, [256, False, -1]]             # 20  P3 OUT (sau bottom-up)

  # ---------- Bottom-up: P3 → P4 ----------
  - [-1, 1, Conv, [256, 3, 2]]                   # 21
  - [[-1, 11], 1, Concat, [1]]                   # 22  cat head P4 = layer 11
  - [-1, 2, A2C2f, [512, False, -1]]             # 23  P4 OUT

  # ---------- Bottom-up: P4 → P5 ----------
  - [-1, 1, Conv, [512, 3, 2]]                   # 24
  - [[-1, 8], 1, Concat, [1]]                    # 25  cat backbone P5 = layer 8
  - [-1, 2, C3k2, [1024, True]]                  # 26  P5 OUT

  # ---------- Detect 4-scale ----------
  - [[17, 20, 23, 26], 1, Detect, [nc]]          # 27  Detect(P2, P3, P4, P5)
